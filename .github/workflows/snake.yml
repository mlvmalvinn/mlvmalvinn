name: Generate Gold Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: mlvmalvinn
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FFD700&color_dots=%230D0D0D,%23332400,%23664D00,%23997300,%23FFD700
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFD700&color_dots=%230D0D0D,%23332400,%23664D00,%23997300,%23FFD700

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
